<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Listen" />
  <title>Listen</title>
  <style>
    :root {
      --bg: #F6F4F0;
      --surface: #FFFFFF;
      --surface-glass: rgba(246, 244, 240, 0.88);
      --text-primary: #1A1917;
      --text-secondary: #78756E;
      --text-muted: #A8A49C;
      --border: rgba(26, 25, 23, 0.08);
      --highlight-bg: #EAE5DC;
      --accent: #1A1917;
      --accent-fg: #F6F4F0;
      --danger: #B83A2D;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --font-serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121211;
        --surface: #1C1C1A;
        --surface-glass: rgba(18, 18, 17, 0.88);
        --text-primary: #E8E6DF;
        --text-secondary: #8E8B82;
        --text-muted: #5A5852;
        --border: rgba(232, 230, 223, 0.09);
        --highlight-bg: #2A2925;
        --accent: #E8E6DF;
        --accent-fg: #121211;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      height: 100%;
      overflow: hidden;
      user-select: none;
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .topbar {
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: 14px;
      padding-left: 24px;
      padding-right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .btn-minimal {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-minimal:active {
      opacity: 0.7;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-primary);
      border: none;
      padding: 8px 0;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-ghost:active {
      opacity: 0.6;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .voice-trigger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }

    .voice-trigger:active {
      background: var(--highlight-bg);
    }

    .article-list-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 24px calc(var(--safe-bottom) + 32px);
    }

    .empty-state {
      margin-top: 28vh;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state p {
      font-family: var(--font-serif);
      font-size: 17px;
      margin: 0 0 8px;
      color: var(--text-primary);
    }

    .empty-state span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .article-item {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
    }

    .article-item:active .article-item-title {
      opacity: 0.6;
    }

    .article-item-main {
      flex: 1;
      min-width: 0;
    }

    .article-item-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      margin: 0 0 6px;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-item-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .article-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      padding: 6px 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .article-delete-btn:active {
      color: var(--danger);
    }

    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 28px 24px 180px;
    }

    .reader-content-wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .reader-title {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 600;
      line-height: 1.38;
      margin: 0 0 28px;
      letter-spacing: -0.01em;
    }

    .reader-p {
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.85;
      margin: 0 0 20px;
      color: var(--text-primary);
      text-align: justify;
      word-break: break-word;
    }

    .sentence {
      border-radius: 4px;
      padding: 2px 0;
      transition: background-color 0.18s ease;
      cursor: pointer;
    }

    .sentence.active {
      background-color: var(--highlight-bg);
      box-shadow: 0 0 0 3px var(--highlight-bg);
    }

    .player-dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 14px 24px calc(var(--safe-bottom) + 14px);
      z-index: 20;
    }

    .player-dock-inner {
      max-width: 640px;
      margin: 0 auto;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .progress-bar-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    input[type="range"].progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"].progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .progress-label {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      min-width: 48px;
      text-align: right;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .speed-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 68px;
      text-align: center;
      cursor: pointer;
    }

    .play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .play-btn:active {
      transform: scale(0.93);
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .step-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .step-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      padding: 8px 6px;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-sheet {
      width: 100%;
      max-height: 85vh;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 24px calc(var(--safe-bottom) + 20px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      transform: translateY(0);
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-backdrop.hidden .modal-sheet {
      transform: translateY(100%);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .txt-upload-box {
      border: 1px dashed var(--text-muted);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      display: block;
    }

    .txt-upload-box input {
      display: none;
    }

    .input-title {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 15px;
      font-family: var(--font-sans);
      outline: none;
    }

    .input-content {
      width: 100%;
      height: 200px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.6;
      font-family: var(--font-sans);
      resize: none;
      outline: none;
    }

    /* 音色选择器样式 */
    .section-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 4px 0 6px;
      font-weight: 500;
    }

    .tone-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .tone-option {
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 13px;
      text-align: center;
      cursor: pointer;
    }

    .tone-option.selected {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 500;
    }

    .voice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .voice-item {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      cursor: pointer;
    }

    .voice-item.selected {
      border-color: var(--accent);
      background: var(--highlight-bg);
      font-weight: 600;
    }

    .voice-tip {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-secondary);
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 视图 1：首页 -->
  <section id="view-home" class="view">
    <header class="topbar">
      <h1 class="brand-title">Listen</h1>
      <button id="btn-open-import" class="btn-minimal">+ 导入</button>
    </header>
    <main id="article-list" class="article-list-container"></main>
  </section>

  <!-- 视图 2：播放页 -->
  <section id="view-player" class="view hidden">
    <header class="topbar">
      <button id="btn-back" class="btn-ghost">← 列表</button>
      <div class="topbar-right">
        <button id="btn-open-voice" class="voice-trigger">温润女声 ▾</button>
        <span id="player-top-progress" style="font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;">0%</span>
      </div>
    </header>

    <main id="reader-scroll" class="reader-scroll">
      <article class="reader-content-wrap">
        <h1 id="reader-title" class="reader-title"></h1>
        <div id="reader-body"></div>
      </article>
    </main>

    <footer class="player-dock">
      <div class="player-dock-inner">
        <div class="progress-row">
          <div class="progress-bar-wrap">
            <input id="progress-slider" type="range" class="progress-slider" min="0" max="0" value="0" />
          </div>
          <span id="progress-text" class="progress-label">0 / 0</span>
        </div>

        <div class="controls-row">
          <div class="step-group">
            <button id="btn-prev" class="step-btn">上一句</button>
            <button id="btn-next" class="step-btn">下一句</button>
          </div>

          <button id="btn-play" class="play-btn" aria-label="播放或暂停">
            <svg id="icon-play" viewBox="0 0 24 24">
              <path d="M8 5.14v14l11-7-11-7z"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button id="btn-speed" class="speed-btn">1×</button>

      </div>
    </footer>
  </section>

  <!-- 导入文章面板 -->
  <div id="modal-import" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title">导入文章</h2>
        <button id="btn-close-import" class="btn-ghost" style="font-size:14px;color:var(--text-secondary);">取消</button>
      </div>

      <label class="txt-upload-box">
        <input id="file-input" type="file" accept=".txt,text/plain" />
        <span>点击选择本地 .TXT 文件（自动识别编码）</span>
      </label>

      <input id="input-title" type="text" class="input-title" placeholder="文章标题（留空则自动取首行）" />
      <textarea id="input-content" class="input-content" placeholder="在此粘贴文章正文..."></textarea>

      <button id="btn-save-article" class="btn-minimal" style="width:100%;justify-content:center;padding:12px;">保存并开始收听</button>
    </div>
  </div>

  <!-- 音色与声学质感调节面板 -->
  <div id="modal-voice" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title">女声音色与质感</h2>
        <button id="btn-close-voice" class="btn-ghost" style="font-size:14px;color:var(--text-secondary);">完成</button>
      </div>

      <div>
        <div class="section-label">声线质感（柔化高频机械感）</div>
        <div id="tone-grid" class="tone-grid">
          <div class="tone-option" data-tone="warm">温润柔和</div>
          <div class="tone-option" data-tone="calm">低沉知性</div>
          <div class="tone-option" data-tone="clear">清亮原声</div>
        </div>
      </div>

      <div>
        <div class="section-label">本机可用女声（优先推荐：语舒 / 莉莉 / 美佳）</div>
        <div id="voice-list" class="voice-list"></div>
      </div>

      <div class="voice-tip">
        提示：若列表里只有默认语音，请去 iPhone「设置 - 辅助功能 - 朗读内容 - 声音 - 中文」，下载<strong>台湾「语舒」</strong>或<strong>大陆「莉莉」</strong>的高音质包，重启本页面即可切换。
      </div>
    </div>
  </div>

  <script>
    /**************************************************************
     * 1. IndexedDB 本地存储引擎
     **************************************************************/
    const DB_NAME = 'ListenAppDB';
    const DB_VERSION = 1;
    const STORE_ARTICLES = 'articles';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_ARTICLES)) {
            db.createObjectStore(STORE_ARTICLES, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAllArticles() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_ARTICLES, 'readonly');
        const req = tx.objectStore(STORE_ARTICLES).getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => b.updatedAt - a.updatedAt);
          resolve(list);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSaveArticle(article) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_ARTICLES, 'readwrite');
        tx.objectStore(STORE_ARTICLES).put(article);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteArticle(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_ARTICLES, 'readwrite');
        tx.objectStore(STORE_ARTICLES).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /**************************************************************
     * 2. 段落与标点分句算法（记录段尾位置以实现段落呼吸留白）
     **************************************************************/
    function parseArticleText(rawText) {
      const normalized = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const rawParagraphs = normalized.split(/\n+/);
      const paragraphs = [];
      const sentences = [];
      const paragraphEndSet = new Set();

      for (const p of rawParagraphs) {
        const trimmed = p.trim();
        if (!trimmed) continue;

        const primaryChunks = trimmed.match(/[^。！？；.!?;]+[。！？；.!?;”"’']*/g) || [trimmed];
        const pIndices = [];

        for (const chunk of primaryChunks) {
          const cleanChunk = chunk.trim();
          if (!cleanChunk) continue;

          if (cleanChunk.length > 140) {
            const subChunks = cleanChunk.match(/[^，,、]+[，,、]*/g) || [cleanChunk];
            let buffer = '';
            for (const sub of subChunks) {
              if ((buffer + sub).length > 120 && buffer.length > 0) {
                const idx = sentences.length;
                sentences.push(buffer.trim());
                pIndices.push(idx);
                buffer = sub;
              } else {
                buffer += sub;
              }
            }
            if (buffer.trim()) {
              const idx = sentences.length;
              sentences.push(buffer.trim());
              pIndices.push(idx);
            }
          } else {
            const idx = sentences.length;
            sentences.push(cleanChunk);
            pIndices.push(idx);
          }
        }

        if (pIndices.length > 0) {
          paragraphs.push(pIndices);
          paragraphEndSet.add(pIndices[pIndices.length - 1]);
        }
      }

      return { paragraphs, sentences, paragraphEndSet };
    }

    /**************************************************************
     * 3. 柔和女声优选器与声学参数引擎
     **************************************************************/
    const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
    const TONE_PRESETS = {
      warm:  { label: '温润', pitch: 0.93, rateFactor: 0.96 },
      calm:  { label: '知性', pitch: 0.87, rateFactor: 0.94 },
      clear: { label: '清亮', pitch: 1.00, rateFactor: 1.00 }
    };

    // 柔和女声优先级权重表（排除明显男声或搞怪音色）
    const FEMALE_PRIORITY = [
      { keys: ['语舒', '語舒', 'yu-shu', 'yushu'], score: 100, tag: '极柔和·台湾女声' },
      { keys: ['莉莉', 'lili'], score: 95, tag: '自然温婉·大陆女声' },
      { keys: ['美佳', 'meijia'], score: 90, tag: '轻柔亲切·台湾女声' },
      { keys: ['姗姗', '姍姍', 'shanshan'], score: 85, tag: '清脆自然·大陆女声' },
      { keys: ['婷婷', 'tingting', 'ting-ting'], score: 75, tag: '系统标准·大陆女声' },
      { keys: ['sin-ji', 'sinji', '善怡'], score: 60, tag: '粤语女声' }
    ];

    const EXCLUDE_KEYS = ['eddy', 'reed', 'rocko', 'grandpa', 'albert', 'fred', 'ralph', 'bahh', 'boing', 'bubbles', 'cellos', 'zarvox', '彬彬', 'binbin', '力力'];

    let currentSpeedIndex = 1;
    let currentToneKey = localStorage.getItem('listen_tone') || 'warm';
    if (!TONE_PRESETS[currentToneKey]) currentToneKey = 'warm';

    let selectedVoiceURI = localStorage.getItem('listen_voice_uri') || '';
    let availableChineseVoices = [];

    let currentArticle = null;
    let parsedData = { paragraphs: [], sentences: [], paragraphEndSet: new Set() };
    let currentIndex = 0;
    let isPlaying = false;
    let sessionToken = 0;
    let interruptTimer = null;
    let breathTimer = null;
    let wakeLock = null;

    const savedRate = parseFloat(localStorage.getItem('listen_rate') || '1');
    if (SPEEDS.includes(savedRate)) {
      currentSpeedIndex = SPEEDS.indexOf(savedRate);
    }

    function scoreVoice(voice) {
      const nameLower = (voice.name || '').toLowerCase();
      for (const bad of EXCLUDE_KEYS) {
        if (nameLower.includes(bad)) return -1;
      }
      for (const item of FEMALE_PRIORITY) {
        if (item.keys.some(k => nameLower.includes(k))) {
          return item.score;
        }
      }
      return 40;
    }

    function getVoiceTag(voice) {
      const nameLower = (voice.name || '').toLowerCase();
      for (const item of FEMALE_PRIORITY) {
        if (item.keys.some(k => nameLower.includes(k))) {
          return item.tag;
        }
      }
      return voice.lang === 'zh-TW' ? '台湾音色' : '系统中文音色';
    }

    function refreshChineseVoices() {
      const all = window.speechSynthesis.getVoices() || [];
      const zhList = all
        .filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
        .map(v => ({ voice: v, score: scoreVoice(v), tag: getVoiceTag(v) }))
        .filter(item => item.score > 0);

      zhList.sort((a, b) => b.score - a.score);
      availableChineseVoices = zhList;

      // 如果用户还没手动选过，自动锁定得分最高的柔和女声
      if (!selectedVoiceURI && zhList.length > 0) {
        selectedVoiceURI = zhList[0].voice.voiceURI;
      } else if (selectedVoiceURI && zhList.length > 0) {
        const exists = zhList.some(item => item.voice.voiceURI === selectedVoiceURI);
        if (!exists) selectedVoiceURI = zhList[0].voice.voiceURI;
      }

      updateVoiceHeaderBadge();
    }

    function getSelectedVoiceObject() {
      if (availableChineseVoices.length === 0) {
        refreshChineseVoices();
      }
      const found = availableChineseVoices.find(item => item.voice.voiceURI === selectedVoiceURI);
      if (found) return found.voice;
      if (availableChineseVoices.length > 0) return availableChineseVoices[0].voice;
      return null;
    }

    function updateVoiceHeaderBadge() {
      const btn = document.getElementById('btn-open-voice');
      if (!btn) return;
      const toneLabel = TONE_PRESETS[currentToneKey].label;
      const vObj = getSelectedVoiceObject();
      if (vObj) {
        const shortName = vObj.name.replace(/\s*\(.*?\)\s*/g, '').slice(0, 6);
        btn.textContent = `${toneLabel} · ${shortName} ▾`;
      } else {
        btn.textContent = `${toneLabel}女声 ▾`;
      }
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (_) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function clearTimers() {
      if (interruptTimer) {
        clearTimeout(interruptTimer);
        interruptTimer = null;
      }
      if (breathTimer) {
        clearTimeout(breathTimer);
        breathTimer = null;
      }
    }

    // 核心发声函数：严格同步 voice 与 lang，避免 iOS WebKit 语言冲突静默
    function speakSentenceDirect(myToken, useFallbackWithoutVoice = false) {
      if (!currentArticle || parsedData.sentences.length === 0 || !isPlaying) return;
      if (myToken !== sessionToken) return;

      if (currentIndex >= parsedData.sentences.length) {
        currentIndex = 0;
      }

      const textToSpeak = parsedData.sentences[currentIndex];
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      window.__activeUtterance = utterance;

      const isChinese = /[\u4e00-\u9fa5]/.test(textToSpeak);
      const tone = TONE_PRESETS[currentToneKey] || TONE_PRESETS.warm;

      if (isChinese && !useFallbackWithoutVoice) {
        const chosenVoice = getSelectedVoiceObject();
        if (chosenVoice) {
          utterance.voice = chosenVoice;
          // 关键：iOS 下指定 voice 对象时，lang 必须与该 voice 的语言完全一致
          utterance.lang = chosenVoice.lang || 'zh-CN';
        } else {
          utterance.lang = 'zh-CN';
        }
      } else {
        utterance.lang = isChinese ? 'zh-CN' : 'en-US';
      }

      // 声学柔化：微降高频共振峰 + 平滑倍速
      utterance.pitch = tone.pitch;
      utterance.rate = Number((SPEEDS[currentSpeedIndex] * tone.rateFactor).toFixed(2));
      utterance.volume = 1.0;

      utterance.onend = () => {
        if (myToken !== sessionToken || !isPlaying) return;
        if (currentIndex + 1 < parsedData.sentences.length) {
          const isParagraphEnd = parsedData.paragraphEndSet.has(currentIndex);
          currentIndex++;
          saveProgressSilently();
          updatePlayerUI(true);

          // 自然呼吸留白：段尾停顿 320ms，句间停顿 140ms
          const pauseMs = isParagraphEnd ? 320 : 140;
          breathTimer = setTimeout(() => {
            speakSentenceDirect(myToken, false);
          }, pauseMs);
        } else {
          isPlaying = false;
          releaseWakeLock();
          saveProgressSilently();
          updatePlayButtonUI();
        }
      };

      utterance.onerror = (e) => {
        if (myToken !== sessionToken) return;
        if (e.error !== 'canceled' && e.error !== 'interrupted') {
          // 如果因为某个未下载完整的语音包报错，自动回退系统默认语音重试一次
          if (!useFallbackWithoutVoice) {
            speakSentenceDirect(myToken, true);
            return;
          }
          isPlaying = false;
          releaseWakeLock();
          updatePlayButtonUI();
        }
      };

      updatePlayerUI(true);
      window.speechSynthesis.speak(utterance);
    }

    function startPlayback() {
      if (!currentArticle || parsedData.sentences.length === 0) return;
      clearTimers();

      const myToken = ++sessionToken;
      isPlaying = true;
      updatePlayButtonUI();
      requestWakeLock();

      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
        interruptTimer = setTimeout(() => {
          speakSentenceDirect(myToken, false);
        }, 65);
      } else {
        speakSentenceDirect(myToken, false);
      }
    }

    function restartCurrentSentenceIfPlaying() {
      if (!isPlaying) {
        updatePlayerUI(true);
        return;
      }
      clearTimers();
      const myToken = ++sessionToken;
      window.speechSynthesis.cancel();
      updatePlayerUI(true);
      interruptTimer = setTimeout(() => {
        speakSentenceDirect(myToken, false);
      }, 65);
    }

    function pausePlayback() {
      clearTimers();
      sessionToken++;
      isPlaying = false;
      window.speechSynthesis.cancel();
      releaseWakeLock();
      saveProgressSilently();
      updatePlayButtonUI();
    }

    function togglePlayback() {
      if (isPlaying) {
        pausePlayback();
      } else {
        startPlayback();
      }
    }

    async function saveProgressSilently() {
      if (!currentArticle) return;
      currentArticle.currentIndex = currentIndex;
      currentArticle.totalSentences = parsedData.sentences.length;
      currentArticle.updatedAt = Date.now();
      localStorage.setItem('listen_last_article_id', currentArticle.id);
      await dbSaveArticle(currentArticle);
    }

    /**************************************************************
     * 4. 界面渲染与交互绑定
     **************************************************************/
    const viewHome = document.getElementById('view-home');
    const viewPlayer = document.getElementById('view-player');
    const articleListEl = document.getElementById('article-list');
    const readerScrollEl = document.getElementById('reader-scroll');
    const readerTitleEl = document.getElementById('reader-title');
    const readerBodyEl = document.getElementById('reader-body');
    const progressSlider = document.getElementById('progress-slider');
    const progressText = document.getElementById('progress-text');
    const playerTopProgress = document.getElementById('player-top-progress');
    const btnPlay = document.getElementById('btn-play');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const btnSpeed = document.getElementById('btn-speed');
    const modalImport = document.getElementById('modal-import');
    const modalVoice = document.getElementById('modal-voice');
    const inputTitle = document.getElementById('input-title');
    const inputContent = document.getElementById('input-content');
    const fileInput = document.getElementById('file-input');

    btnSpeed.textContent = `${SPEEDS[currentSpeedIndex]}×`;

    function updatePlayButtonUI() {
      if (isPlaying) {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }
    }

    function updatePlayerUI(autoScroll = false) {
      const total = parsedData.sentences.length;
      if (total === 0) return;

      progressSlider.max = total - 1;
      progressSlider.value = currentIndex;
      progressText.textContent = `${currentIndex + 1} / ${total}`;
      const pct = Math.round(((currentIndex + 1) / total) * 100);
      playerTopProgress.textContent = `${pct}%`;

      const prevActive = readerBodyEl.querySelector('.sentence.active');
      if (prevActive) prevActive.classList.remove('active');

      const currentEl = readerBodyEl.querySelector(`.sentence[data-idx="${currentIndex}"]`);
      if (currentEl) {
        currentEl.classList.add('active');
        if (autoScroll) {
          const rect = currentEl.getBoundingClientRect();
          const containerRect = readerScrollEl.getBoundingClientRect();
          const offset = rect.top - containerRect.top;
          if (offset < 80 || offset > containerRect.height - 220) {
            currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }
    }

    function renderVoiceModal() {
      refreshChineseVoices();

      // 渲染 3 档声线质感
      document.querySelectorAll('#tone-grid .tone-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.tone === currentToneKey);
      });

      // 渲染手机本地识别到的中文女声列表
      const listEl = document.getElementById('voice-list');
      listEl.innerHTML = '';

      if (availableChineseVoices.length === 0) {
        listEl.innerHTML = `<div class="voice-tip">正在读取 iOS 语音库，请先点击播放任意一句话以激活列表。</div>`;
        return;
      }

      const activeVoice = getSelectedVoiceObject();
      availableChineseVoices.forEach(({ voice, tag }) => {
        const item = document.createElement('div');
        const isSel = activeVoice && activeVoice.voiceURI === voice.voiceURI;
        item.className = 'voice-item' + (isSel ? ' selected' : '');
        item.innerHTML = `
          <span>${voice.name}</span>
          <span style="font-size:12px;color:var(--text-secondary);">${tag}</span>
        `;
        item.addEventListener('click', () => {
          selectedVoiceURI = voice.voiceURI;
          localStorage.setItem('listen_voice_uri', selectedVoiceURI);
          updateVoiceHeaderBadge();
          renderVoiceModal();
          if (isPlaying) {
            restartCurrentSentenceIfPlaying();
          }
        });
        listEl.appendChild(item);
      });
    }

    document.querySelectorAll('#tone-grid .tone-option').forEach(el => {
      el.addEventListener('click', () => {
        currentToneKey = el.dataset.tone;
        localStorage.setItem('listen_tone', currentToneKey);
        updateVoiceHeaderBadge();
        renderVoiceModal();
        if (isPlaying) {
          restartCurrentSentenceIfPlaying();
        }
      });
    });

    document.getElementById('btn-open-voice').addEventListener('click', () => {
      renderVoiceModal();
      modalVoice.classList.remove('hidden');
    });

    document.getElementById('btn-close-voice').addEventListener('click', () => {
      modalVoice.classList.add('hidden');
    });

    async function renderHomeList() {
      const articles = await dbGetAllArticles();
      if (articles.length === 0) {
        articleListEl.innerHTML = `
          <div class="empty-state">
            <p>尚无文章</p>
            <span>点击右上角「+ 导入」粘贴文章或导入 TXT</span>
          </div>
        `;
        return;
      }

      articleListEl.innerHTML = '';
      for (const item of articles) {
        const total = item.totalSentences || 1;
        const idx = item.currentIndex || 0;
        const pct = idx === 0 ? '未开始' : (idx + 1 >= total ? '已听完' : `已听 ${Math.round(((idx + 1) / total) * 100)}%`);
        const wordCount = (item.content || '').length;

        const row = document.createElement('div');
        row.className = 'article-item';
        row.innerHTML = `
          <div class="article-item-main">
            <h3 class="article-item-title"></h3>
            <div class="article-item-meta">
              <span>${pct}</span>
              <span>·</span>
              <span>${wordCount} 字</span>
            </div>
          </div>
          <button class="article-delete-btn" aria-label="删除">删除</button>
        `;
        row.querySelector('.article-item-title').textContent = item.title;

        row.querySelector('.article-item-main').addEventListener('click', () => {
          openArticleInPlayer(item);
        });

        row.querySelector('.article-delete-btn').addEventListener('click', async (e) => {
          e.stopPropagation();
          await dbDeleteArticle(item.id);
          if (localStorage.getItem('listen_last_article_id') === item.id) {
            localStorage.removeItem('listen_last_article_id');
          }
          renderHomeList();
        });

        articleListEl.appendChild(row);
      }
    }

    function openArticleInPlayer(article) {
      if (isPlaying) {
        pausePlayback();
      }
      currentArticle = article;
      parsedData = parseArticleText(article.content);
      currentIndex = Math.min(article.currentIndex || 0, Math.max(0, parsedData.sentences.length - 1));

      readerTitleEl.textContent = article.title;
      readerBodyEl.innerHTML = '';

      parsedData.paragraphs.forEach(pIndices => {
        const pEl = document.createElement('p');
        pEl.className = 'reader-p';
        pIndices.forEach(idx => {
          const span = document.createElement('span');
          span.className = 'sentence';
          span.dataset.idx = idx;
          span.textContent = parsedData.sentences[idx] + ' ';
          span.addEventListener('click', () => {
            currentIndex = idx;
            saveProgressSilently();
            if (isPlaying) {
              restartCurrentSentenceIfPlaying();
            } else {
              startPlayback();
            }
          });
          pEl.appendChild(span);
        });
        readerBodyEl.appendChild(pEl);
      });

      viewHome.classList.add('hidden');
      viewPlayer.classList.remove('hidden');
      localStorage.setItem('listen_last_article_id', article.id);
      updateVoiceHeaderBadge();

      setTimeout(() => {
        updatePlayerUI(true);
      }, 60);
    }

    btnPlay.addEventListener('click', togglePlayback);

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (!currentArticle || currentIndex <= 0) return;
      currentIndex--;
      saveProgressSilently();
      restartCurrentSentenceIfPlaying();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (!currentArticle || currentIndex + 1 >= parsedData.sentences.length) return;
      currentIndex++;
      saveProgressSilently();
      restartCurrentSentenceIfPlaying();
    });

    btnSpeed.addEventListener('click', () => {
      currentSpeedIndex = (currentSpeedIndex + 1) % SPEEDS.length;
      const newRate = SPEEDS[currentSpeedIndex];
      btnSpeed.textContent = `${newRate}×`;
      localStorage.setItem('listen_rate', String(newRate));
      if (isPlaying) {
        restartCurrentSentenceIfPlaying();
      }
    });

    progressSlider.addEventListener('input', (e) => {
      currentIndex = parseInt(e.target.value, 10) || 0;
      updatePlayerUI(true);
    });

    progressSlider.addEventListener('change', () => {
      saveProgressSilently();
      if (isPlaying) {
        restartCurrentSentenceIfPlaying();
      }
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      pausePlayback();
      viewPlayer.classList.add('hidden');
      viewHome.classList.remove('hidden');
      renderHomeList();
    });

    document.getElementById('btn-open-import').addEventListener('click', () => {
      inputTitle.value = '';
      inputContent.value = '';
      fileInput.value = '';
      modalImport.classList.remove('hidden');
    });

    document.getElementById('btn-close-import').addEventListener('click', () => {
      modalImport.classList.add('hidden');
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const buffer = await file.arrayBuffer();
      let decodedText = '';
      try {
        const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
        decodedText = utf8Decoder.decode(buffer);
      } catch (_) {
        const gbkDecoder = new TextDecoder('gb18030');
        decodedText = gbkDecoder.decode(buffer);
      }

      const cleanName = file.name.replace(/\.txt$/i, '').trim();
      if (!inputTitle.value.trim()) {
        inputTitle.value = cleanName;
      }
      inputContent.value = decodedText.trim();
    });

    document.getElementById('btn-save-article').addEventListener('click', async () => {
      const rawContent = inputContent.value.trim();
      if (!rawContent) return;

      let title = inputTitle.value.trim();
      if (!title) {
        const firstLine = rawContent.split(/\n+/)[0].trim();
        title = firstLine.slice(0, 36) || '未命名文章';
      }

      const parsed = parseArticleText(rawContent);
      if (parsed.sentences.length === 0) return;

      const newArticle = {
        id: 'art_' + Date.now(),
        title,
        content: rawContent,
        currentIndex: 0,
        totalSentences: parsed.sentences.length,
        updatedAt: Date.now()
      };

      await dbSaveArticle(newArticle);
      modalImport.classList.add('hidden');
      await renderHomeList();
      openArticleInPlayer(newArticle);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && currentArticle) {
        saveProgressSilently();
      }
    });

    window.speechSynthesis.onvoiceschanged = () => {
      refreshChineseVoices();
    };

    (async function initApp() {
      refreshChineseVoices();
      const articles = await dbGetAllArticles();
      await renderHomeList();
      const lastId = localStorage.getItem('listen_last_article_id');
      if (lastId) {
        const found = articles.find(a => a.id === lastId);
        if (found) {
          openArticleInPlayer(found);
        }
      }
    })();
  </script>
</body>
</html>
